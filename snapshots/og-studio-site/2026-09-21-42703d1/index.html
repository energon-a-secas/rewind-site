  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "OG Studio",
    "description": "Generate branded 1200x630 social preview images for all Neorgon tools, or create custom OG images with 8 pattern styles",
    "url": "https://ogstudio.neorgon.com/",
    "applicationCategory": "DesignApplication",
    "operatingSystem": "Any",
    "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
    "author": { "@type": "Organization", "name": "Neorgon", "url": "https://neorgon.com/" }
  }
  </script>
  <link rel="stylesheet" href="https://cdn.neorgon.org/v1.0.0/styles/base.css">
    <link rel="stylesheet" href="css/style.css">
  <!-- Neorgon Header Kit (vendored; ?header=live swaps CSS to CDN) -->
  <script>(function(){var m=location.search.match(/[?&]theme=([\w-]+)/)||document.cookie.match(/(?:^|;\s*)neo_theme=([\w-]+)/);if(m&&m[1]!=='default')document.documentElement.dataset.theme=decodeURIComponent(m[1]);})();</script>

  <link rel="stylesheet" href="css/neorgon-themes.css">

  <meta name="neo-repo" content="energon-a-secas/og-studio-site">

</head>
<body>

  <a class="skip-link" href="#main">Skip to content</a>

  <header class="header-bar" data-header-mode="app">
    <div class="header-logo">
      <a href="./" class="header-title-link">
        <img src="energon-classic-logo.png" class="header-logo-img" alt="">
        <div class="header-title-wrap">
        <h1>OG Studio</h1>
        <div class="header-subtitle">Social preview image generator</div>
      
        </div>
      </a>
    </div>

    <div class="header-right">
      <nav class="header-actions">
        <button data-keep-mobile class="nav-tab active" data-tab="gallery">Gallery</button>
        <button data-keep-mobile class="nav-tab" data-tab="custom">Custom</button>
    
      </nav>
      <a class="header-home" href="https://neorgon.com/" title="neorgon.com" aria-label="Neorgon home">
        <svg class="nh-hub-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M12 4.4 18.58 8.2 18.58 15.8 12 19.6 5.42 15.8 5.42 8.2Z" fill="currentColor" stroke="none"/>
          <g class="nh-orbit">
            <path d="M2.47 17.50 A11.0 11.0 0 0 1 14.85 1.37" fill="none" stroke="currentColor" stroke-width="1.05" stroke-linecap="round"/>
            <path d="M21.53 6.50 A11.0 11.0 0 0 1 9.15 22.63" fill="none" stroke="currentColor" stroke-width="1.05" stroke-linecap="round"/>
            <circle cx="21.71" cy="6.84" r="1.25" fill="currentColor"/>
            <circle cx="2.29" cy="17.16" r="1.25" fill="currentColor"/>
          </g>
        </svg>
      </a>
    </div>

  </header>

  <main class="container" id="main">

    <!-- Gallery tab (default) -->
    <section class="tab-content active" id="tab-gallery">
      <div class="config-row">
        <label for="gallery-pattern">Pattern:</label>
        <select id="gallery-pattern">
          <option value="constellation" selected>Constellation</option>
          <option value="dots">Dot Grid</option>
          <option value="circuits">Circuit Lines</option>
          <option value="waves">Waves</option>
          <option value="hexgrid">Hex Grid</option>
          <option value="diagonal">Diagonal</option>
          <option value="radial">Radial</option>
          <option value="noise">Noise</option>
          <option value="none">None (gradient only)</option>
        </select>
        <label for="gallery-density">Density:</label>
        <select id="gallery-density">
          <option value="low">Low</option>
          <option value="medium" selected>Medium</option>
          <option value="high">High</option>
        </select>
        <button id="download-all" class="secondary">Download All PNGs</button>
        <button id="batch-logo-toggle" class="secondary" aria-expanded="false" aria-controls="gallery-batch-logo">Batch logo</button>
      </div>
      <div id="gallery-batch-logo" class="collapsible-panel" aria-hidden="true"></div>
      <div class="grid" id="gallery-grid"></div>
    </section>

    <!-- Custom creator tab -->
    <section class="tab-content" id="tab-custom">
      <div class="creator-layout">
        <div class="creator-sidebar" id="creator-sidebar"></div>
        <div class="creator-preview">
          <div class="card">
            <canvas id="custom-canvas"></canvas>
          </div>
        </div>
      </div>
    </section>

  </main>

  <footer class="neo-footer" data-footer-mode="minimal">
    1200x630 social preview images for Open Graph and Twitter Cards  · v1
  </footer>

  <script type="module" src="js/app.js"></script>
</body>
</html>
