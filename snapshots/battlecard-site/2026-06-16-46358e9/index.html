<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <title>BriefCard | Battle Card Builder</title>
  <meta name="description" content="Build customizable sales battle cards with resizable sections, game icons, and color accents. No signup needed, exports to PNG">
  <meta property="og:title" content="BriefCard: Battle Card Builder">
  <meta property="og:description" content="Build and export battle cards with custom sections, icons, and colors">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://briefcard.neorgon.com/">
  <meta property="og:site_name" content="Neorgon">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="BriefCard: Battle Card Builder">
  <meta name="twitter:description" content="Build and export battle cards with custom sections, icons, and colors">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://briefcard.neorgon.com/">
  <meta property="og:locale" content="en_US">
  <meta name="theme-color" content="#040714">
  <meta property="og:image" content="https://briefcard.neorgon.com/og-preview.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:image" content="https://briefcard.neorgon.com/og-preview.jpg">
  <link rel="icon" type="image/x-icon" href="favicon.ico" />
  <link rel="stylesheet" href="css/style.css">
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "BriefCard",
    "description": "Build customizable sales battle cards with resizable sections, game icons, and color accents",
    "url": "https://briefcard.neorgon.com/",
    "applicationCategory": "BusinessApplication",
    "operatingSystem": "Any",
    "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
    "author": { "@type": "Organization", "name": "Neorgon", "url": "https://neorgon.com/" }
  }
  </script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="header-bar">
    <div class="header-logo">
      <a href="https://neorgon.com/" target="_blank" rel="noopener noreferrer">
        <img src="energon-classic-logo.png" class="header-logo-img" alt="Logo">
      </a>
      <a href="./" class="header-title-link">
        <h1>BriefCard</h1>
        <div class="header-subtitle">Battle card builder</div>
      </a>
    </div>
    <nav>
      <button class="nav-link" id="btnExportPng">Export PNG</button>
      <button class="nav-link" id="btnExportView">Export View</button>
      <button class="nav-link nav-danger" id="btnReset">Reset</button>
      <a class="header-home" href="https://neorgon.com/" title="neorgon.com" aria-label="Neorgon home" style="margin-left:5px">
        <svg viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
          <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
        </svg>
      </a>
    </nav>
  </header>

  <main id="main">
    <div class="workspace">

      <div class="toolbar">
        <div class="toolbar-left">
          <span class="toolbar-label">Columns</span>
          <button class="icon-btn" id="btnColsMinus" title="Fewer columns" aria-label="Fewer columns">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" style="width:14px;height:14px;display:block;pointer-events:none"><line x1="5" y1="12" x2="19" y2="12"/></svg>
          </button>
          <span class="cols-count" id="colsCount">3</span>
          <button class="icon-btn" id="btnColsPlus" title="More columns" aria-label="More columns">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" style="width:14px;height:14px;display:block;pointer-events:none"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          </button>
        </div>
        <div id="themePicker" class="theme-picker"></div>
        <div class="toolbar-right">
          <button class="add-section-btn" id="btnAddSection">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="width:15px;height:15px;display:block;pointer-events:none"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
            Add Section
          </button>
        </div>
      </div>

      <div class="battlecard" id="battlecard">
        <div class="card-title-bar">
          <div class="card-title" id="cardTitle" contenteditable="true" spellcheck="false">SALES BATTLECARD</div>
        </div>
        <div class="sections-grid" id="sectionsGrid"></div>
      </div>

    </div>
  </main>

  <!-- Icon + Color modal -->
  <div class="modal-overlay" id="iconModal" hidden>
    <div class="modal">
      <div class="modal-header">
        <span class="modal-title">Icon &amp; Color</span>
        <button class="modal-close" id="iconModalClose" aria-label="Close dialog"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="width:14px;height:14px;display:block;pointer-events:none"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
      </div>
      <div class="modal-body">
        <div class="modal-section-label">Icon</div>
        <div class="icon-grid" id="iconGrid"></div>
        <div class="modal-section-label" style="margin-top:20px">Accent Color</div>
        <div class="color-swatches" id="colorSwatches"></div>
        <input type="color" id="colorPicker" class="color-picker-input" value="#0063e5">
      </div>
    </div>
  </div>

  <!-- Layout modal -->
  <div class="modal-overlay" id="layoutModal" hidden>
    <div class="modal modal-sm">
      <div class="modal-header">
        <span class="modal-title">Section Layout</span>
        <button class="modal-close" id="layoutModalClose" aria-label="Close dialog"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="width:14px;height:14px;display:block;pointer-events:none"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
      </div>
      <div class="modal-body" id="layoutModalBody"></div>
    </div>
  </div>

  <footer class="info-footer">
    Part of <a class="footer-link" href="https://neorgon.com/">Neorgon</a>
  </footer>

  <div class="toast" id="toast"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
