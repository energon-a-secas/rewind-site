  <meta property="og:title" content="GameBin: Curate and share your game lists">
  <meta property="og:description" content="Create visual game lists with Steam integration, custom profiles, and community sharing">

  <meta property="og:locale" content="en_US">

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "GameBin",
    "description": "Create visual game lists with Steam integration, custom profiles, and community sharing",
    "url": "https://gamebin.neorgon.com/",
    "applicationCategory": "GameApplication",
    "operatingSystem": "Any",
    "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
    "author": { "@type": "Organization", "name": "Neorgon", "url": "https://neorgon.com/" }
  }
  </script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <a class="skip-link" href="#main">Skip to content</a>

  <header class="header-bar">
    <div class="header-logo">
      <a href="https://neorgon.com/" target="_blank" rel="noopener noreferrer">
        <img src="https://pub-b597cd281a384f98a47e1f043a6c4160.r2.dev/v1.0.0/energon-classic-logo.png" class="header-logo-img" alt="Logo">
      </a>
      <div>
        <a href="./" class="header-title-link">
          <h1>GameBin</h1>
        </a>
      </div>
    </div>

    <nav id="mainNav">
      <button class="nav-link active" data-view="mylists">Lists</button>
      <button class="nav-link auth-only" data-view="categories">Tags</button>
      <button class="nav-link" data-view="discover">Discover</button>
      <button class="nav-link auth-only" data-view="profile">Profile</button>
      <button type="button" class="auth-toggle" id="authToggle" aria-label="Account">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <circle cx="12" cy="12" r="9"/>
          <circle cx="12" cy="10" r="3"/>
          <path d="M6 19c1.2-3 3.5-4 6-4s4.8 1 6 4"/>
        </svg>
      </button>
      <a class="header-home" href="https://neorgon.com/" title="neorgon.com" aria-label="Neorgon home">
        <svg viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
          <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
        </svg>
      </a>
    </nav>
  </header>

  <div class="auth-panel" id="authPanel">
    <div class="auth-panel-inner">
      <div id="authGate">
        <div class="auth-tabs">
          <button class="auth-tab active" data-tab="login">Log In</button>
          <button class="auth-tab" data-tab="register">Register</button>
        </div>
        <div class="auth-form" id="authLoginForm">
          <input type="text" id="authLoginUser" placeholder="Username" autocomplete="username" maxlength="20">
          <input type="password" id="authLoginPass" placeholder="Password" autocomplete="current-password">
          <div class="auth-error" id="authLoginError" hidden></div>
          <button class="auth-submit" id="authLoginBtn">Log In</button>
        </div>
        <div class="auth-form" id="authRegisterForm" hidden>
          <input type="text" id="authRegUser" placeholder="Choose a username" autocomplete="username" maxlength="20">
          <input type="password" id="authRegPass" placeholder="Choose a password" autocomplete="new-password">
          <div class="auth-error" id="authRegError" hidden></div>
          <button class="auth-submit" id="authRegBtn">Register</button>
        </div>
      </div>
      <div id="authUser" hidden>
        <span class="auth-username" id="authUsername"></span>
        <button class="auth-logout" id="authLogout">Log out</button>
      </div>
    </div>
  </div>

  <main id="main">
    <div class="container" id="appContent"></div>
  </main>

  <footer class="info-footer">
    Part of <a class="footer-link" href="https://neorgon.com/">Neorgon</a>
  </footer>

  <script type="module" src="js/app.js"></script>
</body>
</html>
