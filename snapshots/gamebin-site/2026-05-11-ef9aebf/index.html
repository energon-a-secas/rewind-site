<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GameBin — Curate and share your game lists</title>
  <meta name="description" content="Create visual game lists with Steam integration. Add games by URL, organize with categories, customize your profile, and share lists with the community.">
  <meta property="og:title" content="GameBin — Curate and share your game lists">
  <meta property="og:description" content="Create visual game lists with Steam integration, custom profiles, and community sharing.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://gamebin.neorgon.com/">
  <meta property="og:site_name" content="Neorgon">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="GameBin — Curate and share your game lists">
  <meta name="twitter:description" content="Create visual game lists with Steam integration, custom profiles, and community sharing.">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://gamebin.neorgon.com/">
  <meta property="og:locale" content="en_US">
  <meta name="theme-color" content="#080b14">
  <link rel="icon" type="image/x-icon" href="https://pub-b597cd281a384f98a47e1f043a6c4160.r2.dev/v1.0.0/favicon.ico" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "GameBin",
    "description": "Create visual game lists with Steam integration, custom profiles, and community sharing.",
    "url": "https://gamebin.neorgon.com/",
    "applicationCategory": "GameApplication",
    "operatingSystem": "Any",
    "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
    "author": { "@type": "Organization", "name": "Neorgon", "url": "https://neorgon.com/" }
  }
  </script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <a class="skip-link" href="#main">Skip to content</a>

  <header class="header-bar">
    <div class="header-logo">
      <a href="https://ehq.cl/" target="_blank" rel="noopener noreferrer">
        <img src="https://pub-b597cd281a384f98a47e1f043a6c4160.r2.dev/v1.0.0/energon-classic-logo.png" class="header-logo-img" alt="Logo">
      </a>
      <div>
        <a href="./" class="header-title-link">
          <h1>GameBin</h1>
        </a>
      </div>
    </div>

    <nav id="mainNav">
      <button class="nav-link active" data-view="mylists">Lists</button>
      <button class="nav-link auth-only" data-view="categories">Tags</button>
      <button class="nav-link" data-view="discover">Discover</button>
      <button class="nav-link auth-only" data-view="profile">Profile</button>
      <button class="auth-toggle" id="authToggle" aria-label="Account">
        <svg viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
          <path d="M7.5 6.5C7.5 8.981 9.519 11 12 11s4.5-2.019 4.5-4.5S14.481 2 12 2 7.5 4.019 7.5 6.5zM20 21h1v-1c0-3.859-3.141-7-7-7h-4c-3.86 0-7 3.141-7 7v1h17z"/>
        </svg>
      </button>
      <a class="header-home" href="https://neorgon.com/" title="neorgon.com" aria-label="Neorgon home">
        <svg viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
          <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
        </svg>
      </a>
    </nav>
  </header>

  <div class="auth-panel" id="authPanel">
    <div class="auth-panel-inner">
      <div id="authGate">
        <div class="auth-tabs">
          <button class="auth-tab active" data-tab="login">Log In</button>
          <button class="auth-tab" data-tab="register">Register</button>
        </div>
        <div class="auth-form" id="authLoginForm">
          <input type="text" id="authLoginUser" placeholder="Username" autocomplete="username" maxlength="20">
          <input type="password" id="authLoginPass" placeholder="Password" autocomplete="current-password">
          <div class="auth-error" id="authLoginError" hidden></div>
          <button class="auth-submit" id="authLoginBtn">Log In</button>
        </div>
        <div class="auth-form" id="authRegisterForm" hidden>
          <input type="text" id="authRegUser" placeholder="Choose a username" autocomplete="username" maxlength="20">
          <input type="password" id="authRegPass" placeholder="Choose a password" autocomplete="new-password">
          <div class="auth-error" id="authRegError" hidden></div>
          <button class="auth-submit" id="authRegBtn">Register</button>
        </div>
      </div>
      <div id="authUser" hidden>
        <span class="auth-username" id="authUsername"></span>
        <button class="auth-logout" id="authLogout">Log out</button>
      </div>
    </div>
  </div>

  <main id="main">
    <div class="container" id="appContent"></div>
  </main>

  <footer class="info-footer">
    Part of <a class="footer-link" href="https://neorgon.com/">Neorgon</a>
  </footer>

  <script type="module" src="js/app.js"></script>
</body>
</html>
