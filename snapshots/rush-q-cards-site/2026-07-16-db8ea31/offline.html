<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <meta name="robots" content="noindex, nofollow">
  <title>Rush Q Cards - Offline</title>
  <meta name="description" content="Rush Q Cards is currently offline. Please check your internet connection">
  <meta name="theme-color" content="#17130f">
  <link rel="icon" type="image/x-icon" href="favicon.ico" />

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #040714 0%, #0a0f1d 100%);
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1.6;
    }

    .offline-container {
      text-align: center;
      max-width: 480px;
      padding: 32px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      backdrop-filter: blur(12px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
    }

    .offline-icon {
      font-size: 4rem;
      margin-bottom: 24px;
    }

    .offline-container h1 {
      font-size: 2rem;
      font-weight: 700;
      margin-bottom: 16px;
      color: #fff;
    }

    .offline-container p {
      margin-bottom: 24px;
      color: rgba(255, 255, 255, 0.8);
      font-size: 1.1rem;
    }

    .offline-actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn {
      display: inline-block;
      padding: 12px 24px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
      transitduration: 0.2s;
      cursor: pointer;
      border: none;
      font-size: 1rem;
    }

    .btn-primary {
      background: linear-gradient(135deg, #B015B0 0%, #3D0080 100%);
      color: white;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(176, 21, 176, 0.4);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.1);
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.3);
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    @media (prefers-reduced-motion: reduce) {
      .btn:hover {
        transform: none;
      }
    }

    /* Connection indicator */
    .connection-check {
      margin-top: 24px;
      padding: 16px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 8px;
      font-size: 0.9rem;
    }

    .connection-status {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .status-indicator {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #ff6b6b;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    @media (prefers-reduced-motion: reduce) {
      .status-indicator {
        animation: none;
      }
    }
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap">
</head>
<body>
  <div class="offline-container">
    <div class="offline-icon">🔌</div>
    <h1>You're Offline</h1>
    <p>Rush Q Cards requires an internet connection to load game assets. Please check your connection and try again.</p>

    <div class="offline-actions">
      <button class="btn btn-primary" onclick="window.location.reload()">Try Again</button>
      <button class="btn btn-secondary" onclick="window.location.href = '/'">Back to Home</button>
    </div>

    <div class="connection-check">
      <div class="connection-status">
        <div class="status-indicator"></div>
        <span>Attempting to reconnect...</span>
      </div>
    </div>
  </div>

  <script>
    // Simple connection monitoring
    function checkConnection() {
      if (navigator.onLine) {
        window.location.reload();
      }
    }

    // Monitor connection status
    window.addEventListener('online', checkConnection);
    window.addEventListener('offline', () => {
      console.log('Connection lost');
    });

    // Try to reconnect every 5 seconds
    setInterval(checkConnection, 5000);
  </script>
</body>
</html>
