<body>

  <header class="header-bar" data-header-mode="content">
    <div class="header-logo">
      <a href="https://neorgon.com/" target="_blank" rel="noopener noreferrer">
        <img src="https://cdn.neorgon.org/v1.0.0/energon-classic-logo.png" class="header-logo-img" alt="Neorgon">
      </a>
      <div>
        <a href="./" class="header-title-link" id="headerTitleLink">
          <h1>UI Anatomy</h1>
          <div class="header-subtitle">Hover to learn every component name</div>
        </a>
      </div>
    </div>
    <div class="header-right">
      <div class="header-actions">
        <a class="header-learning" data-keep-mobile href="learning/" title="Checklist, mistakes & AI prompts">
          <svg viewBox="0 0 24 24" fill="currentColor" width="18" height="18"><path d="M12 3L1 9l4 2.18v6L12 21l7-3.82v-6l2-1.09V17h2V9L12 3zm6.82 6L12 12.72 5.18 9 12 5.28 18.82 9zM17 15.99l-5 2.73-5-2.73v-3.72L12 15l5-2.73v3.72z"/></svg>
          Learning
        </a>
      </div>
      <a class="header-home" href="https://neorgon.com/" title="neorgon.com" aria-label="Neorgon home">
        <svg viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
          <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
        </svg>
      </a>
    </div>
  </header>

  <main id="main">

    <!-- Controls bar: layout navigation + toggle buttons -->
    <div class="controls-bar">
      <div class="layout-nav" id="layoutNav" aria-label="Layout categories navigation"></div>
      <button type="button" class="ctrl-btn" id="randomLayoutBtn" title="Random layout" style="margin-left: 8px; margin-right: auto;">
        <svg viewBox="0 0 24 24" fill="currentColor" width="15" height="15">
          <path d="M14 7h4v4h-2V9h-2V7zm2 10v-2h2v4h-4v-2h2zm-9-6H7v2h2v2h2v-4H7zm0-6h4v2H7v2H5V5h4zm6 4h-2V5h2v2h2v2h-2z"/>
        </svg>
        Random
      </button>
      <div class="controls-right">
        <div class="hero-bg-wrap" title="Hero background style">
          <span class="hero-bg-label">Hero</span>
          <div class="hero-bg-picker" id="heroBgPicker"></div>
        </div>
        <button type="button" class="ctrl-btn" id="dummyToggle" title="Toggle dummy content (text + images)" aria-pressed="true">
          <svg viewBox="0 0 20 20" fill="currentColor" width="15" height="15"><path d="M13.586 3.586a2 2 0 112.828 2.828l-.793.793-2.828-2.828.793-.793zM11.379 5.793L3 14.172V17h2.828l8.38-8.379-2.83-2.828z"/></svg>
          Dummy content
        </button>
        <button type="button" class="ctrl-btn" id="outlinesToggle" title="Show all component boundaries" aria-pressed="true">
          <svg viewBox="0 0 20 20" fill="currentColor" width="15" height="15"><path fill-rule="evenodd" d="M4 4a2 2 0 00-2 2v8a2 2 0 002 2h12a2 2 0 002-2V6a2 2 0 00-2-2H4zm0 2h12v8H4V6z" clip-rule="evenodd"/></svg>
          Show outlines
        </button>
        <button type="button" class="ctrl-btn" id="browserToggle" title="Toggle component browser" aria-pressed="true" aria-controls="compBrowser" aria-expanded="true">
          <svg viewBox="0 0 20 20" fill="currentColor" width="15" height="15"><path fill-rule="evenodd" d="M3 5a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm0 5a1 1 0 011-1h8a1 1 0 110 2H4a1 1 0 01-1-1zm0 5a1 1 0 011-1h4a1 1 0 110 2H4a1 1 0 01-1-1z" clip-rule="evenodd"/></svg>
          Components
        </button>
      </div>
    </div>

    <!-- Body: sidebar + mockup -->
    <div class="anatomy-body" id="anatomyBody">

      <!-- Component browser sidebar -->
      <aside class="comp-browser" id="compBrowser" aria-label="Component browser">
        <div class="browser-header">
          <input type="search" id="compSearch" class="browser-search" placeholder="Search…" autocomplete="off" aria-label="Search components">
        </div>
        <div class="browser-list" id="browserList"></div>
      </aside>

      <!-- Wireframe mockup area -->
      <div class="mockup-area" id="mockupArea" role="region" aria-label="Wireframe mockup" aria-describedby="mockupHint">
        <p class="mockup-hint" id="mockupHint">
          <svg viewBox="0 0 20 20" fill="currentColor" width="14" height="14" aria-hidden="true"><path d="M9 9a2 2 0 114 0 2 2 0 01-4 0z"/><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm1-13a4 4 0 00-3.446 6.032l-1.261 1.26a1 1 0 101.414 1.415l1.261-1.261A4 4 0 1011 5z" clip-rule="evenodd"/></svg>
          <span>Hover any part of the mockup to see its name, or use the <strong>Components</strong> list to jump to a part. Click a part to keep its details open.</span>
        </p>
        <div class="mockup-frame" id="mockupFrame"></div>
      </div>

    </div>
  </main>

  <div id="anatomyLive" class="sr-only" aria-live="polite" aria-atomic="true"></div>

  <!-- Floating tooltip panel -->
  <div class="anatomy-tooltip hidden" id="tooltip" role="tooltip">
    <div class="tt-name-row">
      <span class="tt-name" id="ttName"></span>
      <span class="tt-category" id="ttCategory"></span>
    </div>
    <div class="tt-also" id="ttAlso"></div>
    <p class="tt-desc" id="ttDesc"></p>
    <div class="tt-variants-wrap" id="ttVariantsWrap">
      <div class="tt-section-label">Variants</div>
      <div class="tt-variants" id="ttVariants"></div>
    </div>
    <div class="tt-tip-wrap" id="ttTipWrap">
      <div class="tt-section-label">Prompt tip</div>
      <div class="tt-tip" id="ttTip"></div>
    </div>
    <div class="tt-frameworks-wrap" id="ttFrameworksWrap">
      <div class="tt-section-label">Popular frameworks</div>
      <div class="tt-frameworks" id="ttFrameworks"></div>
    </div>
  </div>

  <footer class="info-footer">
    <button type="button" class="footer-tool-btn" id="glossaryExportBtn">Download component glossary (JSON)</button>
    <span class="footer-sep" aria-hidden="true">·</span>
    <a class="footer-link" href="learning/">Checklist &amp; learning guides</a>
    <span class="footer-sep" aria-hidden="true">·</span>
    Part of <a class="footer-link" href="https://neorgon.com/">Neorgon</a>
  </footer>
