<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loadout — Balance your team's week</title>
  <meta name="description" content="Drag your team onto meeting blocks across the week and watch each person's workload fill up, so you catch overload and duplicate syncs early">
  <meta property="og:title" content="Loadout — Balance your team's week">
  <meta property="og:description" content="Drag your team onto meeting blocks across the week and spot overload before it happens">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://loadout.neorgon.com/">
  <meta property="og:site_name" content="Neorgon">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Loadout — Balance your team's week">
  <meta name="twitter:description" content="Drag your team onto meeting blocks and spot overload before it happens">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://loadout.neorgon.com/">
  <meta property="og:locale" content="en_US">
  <meta name="theme-color" content="#040714">
  <meta property="og:image" content="https://loadout.neorgon.com/og-preview.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:image" content="https://loadout.neorgon.com/og-preview.jpg">
  <link rel="icon" type="image/x-icon" href="https://pub-b597cd281a384f98a47e1f043a6c4160.r2.dev/v1.0.0/favicon.ico" />
  <link rel="stylesheet" href="css/style.css">
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "Loadout",
    "description": "Drag your team onto meeting blocks across the week and watch each person's workload fill up, so you catch overload and duplicate syncs early",
    "url": "https://loadout.neorgon.com/",
    "applicationCategory": "BusinessApplication",
    "operatingSystem": "Any",
    "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
    "author": { "@type": "Organization", "name": "Neorgon", "url": "https://neorgon.com/" }
  }
  </script>
</head>
<body>

  <a class="skip-link" href="#main">Skip to content</a>
  <div id="toastLive" aria-live="polite" class="sr-only"></div>

  <!-- Header: nav + home. Nav holds the reset/sample/signals controls. -->
  <header class="header-bar">
    <div class="header-logo">
      <a href="https://neorgon.com/" target="_blank" rel="noopener noreferrer">
        <img src="https://pub-b597cd281a384f98a47e1f043a6c4160.r2.dev/v1.0.0/energon-classic-logo.png" class="header-logo-img" alt="Logo">
      </a>
      <a href="./" class="header-title-link">
        <h1>Loadout</h1>
        <div class="header-subtitle">Balance your team's week</div>
      </a>
    </div>
    <nav>
      <button class="nav-link" id="sampleBtn" title="Load a demo team">Sample team</button>
      <button class="nav-link" id="resetBtn" title="Clear the board">Reset</button>
      <button class="nav-link nav-link--badge" id="insightToggle" aria-label="Toggle signals">
        Signals
        <span class="insight-badge" id="insightBadge" hidden>0</span>
      </button>
      <a class="header-home" href="https://neorgon.com/" title="neorgon.com" aria-label="Neorgon home">
        <svg viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
          <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
        </svg>
      </a>
    </nav>
  </header>

  <!-- Workload preset strip -->
  <div class="settings-strip">
    <label class="strip-field">
      <span>Team profile</span>
      <select id="presetSelect" class="strip-select">
        <option value="new">New team</option>
        <option value="experienced">Experienced</option>
        <option value="support">Support team</option>
        <option value="custom">Custom</option>
      </select>
    </label>
    <label class="strip-field strip-field--range">
      <span>Overload at <strong id="thresholdVal">5h/wk</strong></span>
      <input type="range" id="thresholdRange" min="2" max="20" step="1" value="5">
    </label>
    <p class="strip-hint">Load is weekly meeting-hours, weighted by how often each meeting recurs.</p>
  </div>

  <!-- Week tabs: switch, duplicate, and add weeks -->
  <nav class="week-bar" id="weekTabs" aria-label="Weeks"></nav>

  <main id="main">
    <div class="workspace">

      <!-- Left: roster / party rail -->
      <aside class="roster" id="roster" aria-label="Team roster">
        <h2 class="roster-head">Your team</h2>
        <div class="roster-list" id="rosterList"></div>
        <form class="roster-add" onsubmit="return false">
          <input type="text" id="personName" class="roster-input" placeholder="Add a teammate" maxlength="40" autocomplete="off" aria-label="Teammate name">
          <button type="button" class="btn btn--primary btn--sm" id="addPersonBtn">Add</button>
        </form>
        <p class="roster-tip">Drag a teammate onto a meeting, or click to pick them up then click a meeting.</p>
      </aside>

      <!-- Center: Mon–Fri board -->
      <section class="board" id="board" aria-label="Week board"></section>

    </div>
  </main>

  <!-- Right: insight drawer (slide-over) -->
  <aside class="insight-drawer" id="insightDrawer" aria-label="Workload signals">
    <header class="drawer-head">
      <h2>Signals</h2>
      <button class="btn btn--ghost btn--icon" id="drawerClose" aria-label="Close signals">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </header>
    <div class="drawer-body" id="insightList"></div>
  </aside>
  <div class="drawer-scrim" id="drawerScrim"></div>

  <footer class="info-footer">
    Part of <a class="footer-link" href="https://neorgon.com/">Neorgon</a>
  </footer>

  <script type="module" src="js/app.js"></script>
</body>
</html>
